version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neetpg_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neetpg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neetpg_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-neetpg_qbank}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neetpg_user} -d ${POSTGRES_DB:-neetpg_qbank}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neetpg_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neetpg_user}:${POSTGRES_PASSWORD:-neetpg_secure_password_2026}@postgres:5432/${POSTGRES_DB:-neetpg_qbank}
      SECRET_KEY: ${SECRET_KEY:-neet-pg-qbank-super-secret-jwt-key-2026-production}
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: neetpg_admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:

